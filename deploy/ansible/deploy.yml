# Deploy RBR-MP-Server to any Linux host with systemd.
#
#   ansible-playbook -i inventory.ini deploy.yml
#   ansible-playbook -i inventory.ini deploy.yml -e rbrmp_version=v0.2.0   # upgrade
#
# The server is a single static binary, so this is deliberately not Docker:
# download the release, install a hardened systemd unit, open the UDP port.
# Re-running with a new rbrmp_version downloads that version and restarts.
#
# The repo is private, so the release is fetched on the control node with `gh`
# (which already has your credentials) and copied up. No token on the server.
# Requires: gh installed and `gh auth login` done locally.

- name: Deploy RBR-MP-Server
  hosts: rbrmp
  become: true

  vars:
    # Pin the release to deploy; override with -e rbrmp_version=vX.Y.Z
    rbrmp_version: v0.1.0
    rbrmp_arch: linux-amd64          # or linux-arm64 once released
    rbrmp_port: 40100
    # Every flag the binary takes; -addr is derived from rbrmp_port.
    rbrmp_flags: "-tick 30 -echo 0 -stats 60s"
    # Set false if the host has no ufw or the firewall is managed elsewhere.
    rbrmp_manage_ufw: true
    # Auto-update: a systemd timer checks GitHub Releases and swaps the binary
    # in (restarting the service) whenever a new release appears. Set false to
    # only ever deploy the pinned rbrmp_version.
    rbrmp_auto_update: true
    rbrmp_update_every: 5min

    rbrmp_repo: ryczek02/rbr-mp-server
    # Where the control node keeps downloaded releases between runs.
    rbrmp_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/rbrmp-deploy"

    rbrmp_asset: "rbrmp-server-{{ rbrmp_arch }}"
    rbrmp_local_binary: "{{ rbrmp_cache_dir }}/{{ rbrmp_version }}/{{ rbrmp_asset }}"

  tasks:
    - name: Check gh is authenticated on the control node
      ansible.builtin.command: gh auth status
      delegate_to: localhost
      run_once: true
      become: false
      changed_when: false
      register: rbrmp_gh_auth
      failed_when: rbrmp_gh_auth.rc != 0
      # The release lives in a private repo; without gh credentials the
      # download below 404s. Run `gh auth login` and retry.

    - name: Fetch the release binary to the control node
      ansible.builtin.command:
        cmd: >-
          gh release download {{ rbrmp_version }}
          --repo {{ rbrmp_repo }}
          --pattern {{ rbrmp_asset }}
          --dir {{ rbrmp_cache_dir }}/{{ rbrmp_version }}
        creates: "{{ rbrmp_local_binary }}"
      delegate_to: localhost
      run_once: true
      become: false

    - name: System user for the service
      ansible.builtin.user:
        name: rbrmp
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Install directory
      ansible.builtin.file:
        path: /opt/rbrmp
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Upload the release binary (one file per version)
      ansible.builtin.copy:
        src: "{{ rbrmp_local_binary }}"
        dest: "/opt/rbrmp/rbrmp-server-{{ rbrmp_version }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart rbrmp-server

    - name: Point the current-version link at it
      ansible.builtin.file:
        src: "/opt/rbrmp/rbrmp-server-{{ rbrmp_version }}"
        dest: /opt/rbrmp/rbrmp-server
        state: link
      notify: Restart rbrmp-server

    - name: Systemd unit
      ansible.builtin.template:
        src: rbrmp-server.service.j2
        dest: /etc/systemd/system/rbrmp-server.service
        mode: "0644"
      notify: Restart rbrmp-server

    - name: Service enabled and started
      ansible.builtin.systemd:
        name: rbrmp-server
        enabled: true
        state: started
        daemon_reload: true

    - name: Auto-update script
      ansible.builtin.template:
        src: rbrmp-update.sh.j2
        dest: /opt/rbrmp/update.sh
        mode: "0755"
      when: rbrmp_auto_update

    - name: Auto-update service + timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - rbrmp-update.service
        - rbrmp-update.timer
      when: rbrmp_auto_update

    - name: Auto-update timer enabled
      ansible.builtin.systemd:
        name: rbrmp-update.timer
        enabled: true
        state: started
        daemon_reload: true
      when: rbrmp_auto_update

    - name: Open the UDP port (ufw)
      community.general.ufw:
        rule: allow
        port: "{{ rbrmp_port }}"
        proto: udp
      when: rbrmp_manage_ufw

  handlers:
    - name: Restart rbrmp-server
      ansible.builtin.systemd:
        name: rbrmp-server
        state: restarted
        daemon_reload: true
